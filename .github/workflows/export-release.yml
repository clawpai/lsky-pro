name: Export Image to Release

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clawpai/lsky-pro:latest

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE }}

      - name: Export & compress
        run: |
          docker save ${{ env.IMAGE }} | gzip -1 > lsky-pro-2.2.3.tar.gz
          ls -lh lsky-pro-2.2.3.tar.gz

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create image-export --title "镜像导出包" --notes "Lsky Pro 2.2.3 amd64 镜像 tar.gz（docker load 导入）" || true

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload image-export lsky-pro-2.2.3.tar.gz --clobber
          echo "=== 完成 ==="
          gh release view image-export --json assets -q '.assets[] | .name + " " + .size'